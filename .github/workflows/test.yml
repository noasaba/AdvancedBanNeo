name: Unit tests

on:
  pull_request:
    branches: [ master, development ]
  push:
    branches: [ master, development ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: advancedban
          MYSQL_USER: advancedban
          MYSQL_PASSWORD: advancedban
          MYSQL_ROOT_PASSWORD: advancedban-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -padvancedban-root"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=30
    env:
      ADVANCEDBAN_MYSQL_HOST: 127.0.0.1
      ADVANCEDBAN_MYSQL_DATABASE: advancedban
      ADVANCEDBAN_MYSQL_USER: advancedban
      ADVANCEDBAN_MYSQL_PASSWORD: advancedban

    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '25'
        cache: maven

    - name: Test with Maven
      run: mvn -B clean verify --file pom.xml
